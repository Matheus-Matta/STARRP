# OPÇÃO ANTIGA (Caddy). A produção atual é docker/ (nginx + blue/green, ver docker/README.md).
#
# Produção completa num servidor Linux com Docker (rode da RAIZ do repositório):
#
#   docker compose -f deploy/production/docker-compose.yml --env-file .env up -d --build
#
# O .env da raiz precisa, no mínimo (ver .env.example):
#   DJANGO_ENV=production  DJANGO_SECRET_KEY=<64 caracteres>  SITE_ADDRESS=app.suaempresa.com.br
#   FRONTEND_URL=https://app.suaempresa.com.br  DJANGO_ALLOWED_HOSTS=app.suaempresa.com.br
#   DJANGO_CORS_ALLOWED_ORIGINS=https://app.suaempresa.com.br  POSTGRES_PASSWORD=<senha forte>
# Portas 80 e 443 (TCP e UDP) abertas: o Caddy emite o certificado e redireciona http → https.
name: starrp

x-backend: &backend
  build: { context: ../.., dockerfile: backend/Dockerfile }
  # Sem variável: builda daqui. Com a versão publicada pelo GitHub (release-backend.yml):
  #   BACKEND_IMAGE=ghcr.io/<dono>/starrp-backend:1.0.1 docker compose ... pull && ... up -d --no-build
  image: ${BACKEND_IMAGE:-starrp-backend}
  restart: unless-stopped
  env_file: ../../.env
  environment:
    DJANGO_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-starrp}
    POSTGRES_USER: ${POSTGRES_USER:-starrp}
    REDIS_URL: redis://redis:6379/0
    # Atrás do Caddy (só ele publica porta nesta rede): aceita o X-Forwarded-For dele (S-20).
    FORWARDED_ALLOW_IPS: "*"
  volumes:
    - media:/app/media
    # Certificado A1 cifrado (PRIVATE_MEDIA_ROOT): só o backend monta; nginx/Caddy nunca.
    - private:/app/private
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  web:
    build: { context: ../.., dockerfile: frontend/Dockerfile }
    # Idem: WEB_IMAGE=ghcr.io/<dono>/starrp-web:1.0.1 (release-frontend.yml).
    image: ${WEB_IMAGE:-starrp-web}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS (domínio público) no .env}
      BACKEND_UPSTREAM: backend:8000
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data        # certificados: sem este volume, cada deploy pede um novo (e o Let's Encrypt limita)
      - caddy_config:/config
    depends_on: [backend]

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 90s

  # Fila (precificação, SEO, relatórios pesados) e agendador. Mesma imagem, sem migrate.
  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starrp}
      POSTGRES_USER: ${POSTGRES_USER:-starrp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  media:
  private:
  postgres:
  redis:
  caddy_data:
  caddy_config:
