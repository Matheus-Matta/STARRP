# nginx principal do Starrp. A configuração do site vem do template (nginx/templates/starrp.conf.template),
# que o container gera em /etc/nginx/starrp/ com as variáveis NGINX_* do .env. O default.conf de exemplo
# da imagem (/etc/nginx/conf.d) não entra.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sem a query string (S-15): ?busca=, ids e qualquer parâmetro sensível não ficam no log.
    log_format starrp '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time up=$upstream_addr ut=$upstream_response_time';
    access_log /var/log/nginx/access.log starrp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    include /etc/nginx/starrp/*.conf;
}
