# Cabeçalhos para o Django/uvicorn (incluído em cada location do backend).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# O Django confia neste cabeçalho para saber que é HTTPS (SECURE_PROXY_SSL_HEADER): cookie Secure e redirect.
proxy_set_header X-Forwarded-Proto https;
# Só o IP real (já resolvido da Cloudflare). Nunca anexa o que o cliente mandou: X-Forwarded-For falso não passa.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;      # exportações grandes (Excel) cabem; mais que isso o nginx corta
proxy_send_timeout 120s;
# Backend fora (troca blue/green): tenta o outro. POST/PATCH não repetem (não duplica venda nem pagamento).
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_buffering on;
