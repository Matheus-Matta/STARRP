# Quem pode abrir o admin do Django (/admin/) — S-13, docs/SEGURANCA.md. Padrão: todos (com limite de login).
# Recomendado em produção: só os IPs da equipe/VPN e negar o resto. Ex.:
#   allow 203.0.113.10;
#   allow 198.51.100.0/24;
#   deny all;
# (Ou proteja o /admin/ com o Cloudflare Access e deixe este arquivo como está.)
allow all;
