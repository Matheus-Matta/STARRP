# Release do APP MÓVEL: só a tag mobile-v<versão> dispara (ex.: mobile-v1.0.1).
# Gera o Starrp-<versão>.apk aqui no GitHub (expo prebuild + Gradle, `npm run build:apk`), SEM o EAS e sem conta
# Expo, e anexa à Release do GitHub com os commits de mobile/ (e frontend/src, que o app reaproveita). O APK
# instala direto nos aparelhos da loja (não vai para a Play Store). Versão do app = versão da tag; versionCode =
# X·10000 + Y·100 + Z.
#
# Opcional (Settings → Secrets and variables → Actions):
#   - variável MOBILE_API_URL=https://app.suaempresa.com.br: servidor já preenchido no login (sem ela, digita-se lá);
#   - segredos ANDROID_KEYSTORE_BASE64 (o .jks em base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e
#     ANDROID_KEY_PASSWORD: assina com a chave da empresa. Sem eles, sai com a chave de DEBUG (bom para começar;
#     trocar de chave depois obriga a desinstalar o app antigo).

name: Release mobile

on:
  push:
    tags: ["mobile-v*"]

concurrency:
  group: release-mobile-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read   # escrita só no job que publica (dependências não veem o token de escrita)

jobs:
  info:
    name: Versão e checagens
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: info
        run: bash .github/scripts/release-info.sh mobile mobile/ frontend/src/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-notes
          path: release-notes.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Tipos e lint
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint

  build:
    name: Android APK
    needs: info
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # Repositório inteiro: o app usa ../frontend/src (cadastros, relatórios).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Chave de assinatura (se houver)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o APK sai com a chave de debug."
          fi
      - name: Gerar o APK
        env:
          API_URL: ${{ vars.MOBILE_API_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          VERSION: ${{ needs.info.outputs.version }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"   # Java 17 já instalado no runner (o Gradle do RN pede 17)
          npm run build:apk -- "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mobile-apk
          if-no-files-found: error
          path: mobile/dist/Starrp-*.apk

  release:
    name: Release
    needs: [info, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: App móvel ${{ needs.info.outputs.version }}
          body_path: artifacts/release-notes/release-notes.md
          prerelease: ${{ needs.info.outputs.prerelease == 'true' }}
          files: artifacts/mobile-apk/*.apk
