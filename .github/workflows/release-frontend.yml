# Release do FRONTEND: só a tag frontend-v<versão> dispara (ex.: frontend-v1.0.1).
# Testa, gera a imagem (build do Vue + Caddy) e publica em ghcr.io/<dono>/starrp-web:<versão> (+ <maior>.<menor>,
# <maior> e latest quando não é pré-release). Release com os commits de frontend/ e shared/ desde a tag anterior.
name: Release frontend

on:
  push:
    tags: ["frontend-v*"]

concurrency:
  group: release-frontend-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read   # escrita só no job que publica (dependências não veem o token de escrita)

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test

  image:
    name: Imagem Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a Release
      packages: write   # publicar a imagem no GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: info
        run: bash .github/scripts/release-info.sh frontend frontend/ shared/
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/starrp-web
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.info.outputs.version }}
            type=match,pattern=frontend-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=frontend-v(\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest,enable=${{ steps.info.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          # O contexto é a raiz; o que entra está em frontend/Dockerfile.dockerignore.
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Notas com a imagem
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.owner }}/starrp-web:${{ steps.info.outputs.version }}
        run: |
          {
            echo
            echo "**Imagem:** \`${IMAGE}\`"
          } >> release-notes.md
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Frontend ${{ steps.info.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.info.outputs.prerelease == 'true' }}
