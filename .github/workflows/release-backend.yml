# Release do BACKEND: só a tag backend-v<versão> dispara (ex.: git tag backend-v1.0.1 && git push origin backend-v1.0.1).
# Testa, gera a imagem Docker e publica em ghcr.io/<dono>/starrp-backend:<versão> (+ <maior>.<menor>, <maior> e latest
# quando não é pré-release). Cria a Release do GitHub com os commits que mexeram em backend/ desde a tag anterior.
name: Release backend

on:
  push:
    tags: ["backend-v*"]

concurrency:
  group: release-backend-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read   # escrita só no job que publica (dependências não veem o token de escrita)

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Dependências
        run: pip install -r backend/requirements/dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .
      - name: Testes (pytest em paralelo)
        working-directory: backend
        run: python -m pytest -n auto

  image:
    name: Imagem Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a Release
      packages: write   # publicar a imagem no GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # as notas comparam com a tag anterior
      - id: info
        run: bash .github/scripts/release-info.sh backend backend/
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/starrp-backend
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.info.outputs.version }}
            type=match,pattern=backend-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=backend-v(\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest,enable=${{ steps.info.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Notas com a imagem
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.owner }}/starrp-backend:${{ steps.info.outputs.version }}
        run: |
          {
            echo
            echo "**Imagem:** \`${IMAGE}\`"
          } >> release-notes.md
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Backend ${{ steps.info.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.info.outputs.prerelease == 'true' }}
