[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = starrp/tests
# `redteam_tmp`: provas de conceito locais (fora do git), que falham de propósito ou demoram horas.
norecursedirs = .* *.egg build dist venv node_modules redteam_tmp
# --nomigrations: tabelas direto dos models (a criação do banco caiu de ~5 min para segundos). As
# migrations são conferidas por test_migrations.py (model sem migration) e por `npm run test:migrations`.
addopts = -ra -q --nomigrations
filterwarnings =
    error::django.utils.deprecation.RemovedInDjango60Warning
