{% load static %}{% static 'starrp/admin/starhub/img/icones.svg' as icon_sprite %}{% if cl.search_fields %}<div id="toolbar" class="list-search"><form id="changelist-search" method="get" role="search"><label class="list-search-field" for="searchbar"><svg class="icon icon-sm" aria-hidden="true"><use href="{{ icon_sprite }}#search"></use></svg><span class="visually-hidden">Buscar</span><input type="search" name="{{ search_var }}" value="{{ cl.query }}" id="searchbar" placeholder="Buscar {{ cl.opts.verbose_name_plural|lower }}"></label>{% for pair in cl.params.items %}{% if pair.0 != search_var %}<input type="hidden" name="{{ pair.0 }}" value="{{ pair.1 }}">{% endif %}{% endfor %}<button type="submit" class="btn btn-outline">Buscar</button></form></div>{% endif %}
