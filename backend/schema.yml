  /api/v1/catalog/products/:
    get:
      operationId: api_v1_catalog_products_list
      description: Produto com as variantes aninhadas. Venda e estoque usam /catalog/variants/.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: purpose
        schema:
          type: string
          enum:
          - '00'
          - '01'
          - '02'
          - '04'
          - '07'
          - 08
          - 09
          - '99'
        description: |-
          * `00` - Mercadoria para revenda
          * `01` - Matéria-prima / insumo
          * `02` - Embalagem
          * `04` - Produção própria
          * `07` - Uso e consumo
          * `08` - Ativo imobilizado
          * `09` - Serviço
          * `99` - Outros
      - in: query
        name: sale_method
        schema:
          type: string
          enum:
          - fraction
          - unit
          - weight
        description: |-
          * `unit` - Por unidade
          * `weight` - Por peso (balança)
          * `fraction` - Fracionado (metro, litro...)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: track_stock
        schema:
          type: boolean
      - in: query
        name: type
        schema:
          type: string
          enum:
          - kit
          - service
          - simple
          - variable
        description: |-
          * `simple` - Simples
          * `variable` - Com variação (grade)
          * `kit` - Kit / combo
          * `service` - Serviço
      - in: query
        name: type__in
        schema:
          type: array
          items:
            type: string
        description: Valores múltiplos podem ser separados por vírgulas.
        explode: false
        style: form
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: api_v1_catalog_products_create
      description: Produto com as variantes aninhadas. Venda e estoque usam /catalog/variants/.
