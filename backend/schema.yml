  /api/v1/sales/items/:
    get:
      operationId: api_v1_sales_items_list
      description: |-
        Itens vendidos: `?variant__product=<id>&sale__status=completed` = vendas do produto;
        `?sale__customer=<id>` = o que o cliente comprou.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sale
        schema:
          type: string
          format: uuid
      - in: query
        name: sale__cash_session
        schema:
          type: string
          format: uuid
      - in: query
        name: sale__completed_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: sale__completed_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: sale__customer
        schema:
          type: string
          format: uuid
      - in: query
        name: sale__status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - draft
          - open
        description: |-
          * `open` - Aberta
          * `draft` - Pedido guardado
          * `completed` - Concluída
          * `cancelled` - Cancelada
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
        description: |-
          * `active` - Ativo
          * `cancelled` - Cancelado
      - in: query
        name: variant
        schema:
          type: string
          format: uuid
      - in: query
        name: variant__product
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleItemReportList'
          description: ''
