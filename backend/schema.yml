components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      - cancelled
      - approved
      - printed
      type: string
      description: |-
        * `created` - Criado
        * `updated` - Alterado
        * `deleted` - Excluído
        * `cancelled` - Cancelado
        * `approved` - Aprovado
        * `printed` - Impresso
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        code:
          type: string
          description: Código patrimonial impresso na plaqueta.
          maxLength: 40
        description:
          type: string
          maxLength: 180
        serial_number:
          type: string
          maxLength: 120
        brand:
          type: string
          maxLength: 120
        model:
          type: string
          maxLength: 120
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_price:
