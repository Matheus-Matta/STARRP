openapi: 3.0.3
info:
  title: Starrp API
  version: 1.0.0
  description: 'ERP de varejo: PDV desktop/móvel, estoque, fiscal e financeiro.'
paths:
  /api/v1/assets/:
    get:
      operationId: api_v1_assets_list
      parameters:
      - in: query
        name: location
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - in: query
        name: responsible
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - broken
          - disposed
          - in_stock
          - in_use
          - loaned
          - lost
          - maintenance
        description: |-
          * `in_stock` - Em estoque
          * `in_use` - Em uso
          * `maintenance` - Em manutenção
          * `loaned` - Emprestado
          * `broken` - Quebrado
          * `disposed` - Baixado
          * `lost` - Extraviado
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: api_v1_assets_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/v1/assets/{id}/:
    get:
      operationId: api_v1_assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
